version: "3.8"

services:
  # 로컬 개발용 MySQL 서버
  mysql:
    image: mysql:8.0
    container_name: codin-mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: S14P12E205
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - codinnator-network

networks:
  codinnator-network:
    driver: bridge

volumes:
  mysql-data:
