# 서비스 정의: 각 서비스는 하나의 컨테이너입니다
services:
  # ===== MySQL 데이터베이스 =====
  mysql:
    image: mysql:8.0  # Docker Hub에서 가져올 이미지
    container_name: timo
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # 비밀번호 없이 사용
      MYSQL_DATABASE: S14P12E205
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"  # 호스트:컨테이너 포트 매핑
    volumes:
      - mysql-data:/var/lib/mysql  # 데이터 영속성 보장
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - codinnator-network
    healthcheck:  # MySQL이 준비될 때까지 대기
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Spring Boot 백엔드 =====
  backend:
    build:
      context: ./backend  # Dockerfile이 있는 경로
      dockerfile: Dockerfile
    container_name: codin-backend
    ports:
      - "8080:8080"  # Spring Boot 기본 포트
    environment:
      # 데이터베이스 연결 설정
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/S14P12E205?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD:

      # OAuth2 설정 (.env 파일에서 가져옴)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}

      # JWT 및 암호화 설정
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}

      # OpenAI API 설정
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mysql:
        condition: service_healthy  # MySQL이 준비된 후 실행
    networks:
      - codinnator-network
    restart: on-failure  # 실패 시 자동 재시작

  # ===== AI Service (FastAPI) =====
  # 개발 시에는 로컬에서 실행하는 것을 권장합니다 (uvicorn --reload)
  # 필요 시 아래 주석을 해제하세요
  # ai-service:
  #   build:
  #     context: ./ai-service
  #     dockerfile: Dockerfile
  #   container_name: codin-ai-service
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #   networks:
  #     - codinnator-network
  #   restart: on-failure

  # ===== React 프론트엔드 =====
  # 개발 시에는 로컬에서 실행하는 것을 권장합니다 (npm run dev)
  # 프로덕션 배포 시에만 아래 주석을 해제하세요
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: codin-frontend
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - codinnator-network
  #   restart: on-failure

# ===== 네트워크 정의 =====
# 모든 컨테이너가 같은 네트워크에 있어서 서로 통신 가능
networks:
  codinnator-network:
    driver: bridge

# ===== 볼륨 정의 =====
# 컨테이너가 삭제되어도 데이터가 유지됨
volumes:
  mysql-data:
